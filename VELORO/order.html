<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete Purchase Request | VELORO</title>
  <meta name="description" content="Review your tailored formalwear selection, specify measurements and submit your demo order request.">
  <meta name="theme-color" content="#1C2430">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="products">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="section">
      <div class="container" id="standalone-order-root">
        <div class="breadcrumb-bar" style="margin-bottom:20px;">
          <a href="index.html">Home</a>
          <i data-icon="chevron-right"></i>
          <a href="products.html">Collections</a>
          <i data-icon="chevron-right"></i>
          <span aria-current="page">Demo Order Request</span>
        </div>
        <div id="direct-order-container" style="max-width:960px;margin:0 auto;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);">
          <!-- Script will trigger openBuyNow or render inline -->
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="ui-root"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const id = new URLSearchParams(location.search).get('id') || 'VL-107';
        const size = new URLSearchParams(location.search).get('size') || '';
        const colour = new URLSearchParams(location.search).get('colour') || '';
        if(window.openBuyNow) {
          window.openBuyNow(id, size, colour, 1);
        } else {
          const btn = document.createElement('button');
          btn.setAttribute('data-buynow', id);
          btn.style.display = 'none';
          document.body.appendChild(btn);
          btn.click();
        }
      }, 100);
    });
  </script>
</body>
</html>
